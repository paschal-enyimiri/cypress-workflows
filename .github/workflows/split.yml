# reusable workflow to install NPM dependencies
# and run Cypress tests across N machines using cypress-split
# https://github.com/bahmutov/cypress-split
name: split
on:
  workflow_call:
    inputs:
      validate-main:
        description: 'Verify that commits pushed to main originated from the source branch'
        type: boolean
        required: false
        default: false
      main-source-branch:
        description: 'Branch that main must be merged from (default: staging)'
        type: string
        required: false
        default: 'staging'
      nE2E:
        description: 'Number of parallel containers for running E2E specs'
        type: number
        required: false
        default: 0
      nComponent:
        description: 'Number of parallel containers for running Component specs'
        type: number
        required: false
        default: 0
      before-run:
        description: 'A command to run once before all parallel jobs'
        type: string
        required: false
      config:
        description: 'Set configuration values. Separate multiple values with a comma.'
        type: string
        required: false
      config-file:
        description: 'Path to a JSON file where configuration values are set.'
        type: string
        required: false
      env:
        description: 'Sets Cypress environment variables'
        type: string
        required: false
      browser:
        description: 'Name of the browser to use'
        type: string
        required: false
      command:
        description: 'Command that overrides cypress run'
        type: string
        required: false
      start:
        description: 'Command for starting local server in the background'
        type: string
        required: false
      start-windows:
        description: 'A different start command on Windows'
        type: string
        required: false
      build:
        description: 'Command to run in build step before starting tests'
        type: string
        required: false
      install:
        description: 'Whether or not to run install'
        type: boolean
        required: false
        default: true
      install-command:
        description: 'Custom install command to use'
        type: string
        required: false
      runTests:
        description: 'Whether or not to run tests'
        type: boolean
        required: false
        default: true
      wait-on:
        description: 'Local server URL to wait for'
        type: string
        required: false
      wait-on-timeout:
        description: 'Amount of time to wait for wait-on url to be available'
        type: number
        required: false
        default: 60
      working-directory:
        description: 'Working directory containing Cypress folder'
        type: string
        required: false
      headed:
        description: 'Whether or not to use headed mode'
        type: boolean
        required: false
      spec:
        description: 'Provide a specific specs to run'
        type: string
        required: false
      skip-spec:
        description: 'Provide a list of specs to NOT run'
        type: string
        required: false
      project:
        description: 'Path of project to run'
        type: string
        required: false
      command-prefix:
        description: 'You can prefix the default test command using the command-prefix option.'
        type: string
        required: false
      cache-key:
        description: 'Custom cache key'
        type: string
        required: false
      quiet:
        description: 'Whether or not to silence any Cypress specific output from stdout'
        type: boolean
        required: false
        default: false
      debug-inputs:
        description: 'Print the workflow inputs'
        type: boolean
        required: false
        default: false
      debug:
        description: 'Set the environment variable DEBUG'
        type: string
        required: false
        default: ''
      store-artifacts:
        description: 'Store screenshots and videos from the cypress folder'
        type: boolean
        required: false
        default: true
      marge:
        description: |
          Download the Mochawesome results from all test jobs
          and merge into a single report
        type: boolean
        required: false
        default: false
      coverage:
        description: |
          Download all coverage results from all test jobs
          and merge into a single coverage report
        type: boolean
        required: false
        default: false
      publish-summary:
        description: 'Whether or not to publish job summary'
        type: boolean
        required: false
        default: false
      split-file:
        description: 'E2E split timings file to use and merge back'
        type: string
        required: false
    secrets:
      ADMIN_USERNAME:
        required: false
      ADMIN_PASSWORD:
        required: false
      EMPLOYEE_USERNAME:
        required: false
      EMPLOYEE_PASSWORD:
        required: false
      SUPERVISOR_USERNAME:
        required: false
      SUPERVISOR_PASSWORD:
        required: false
      HOD_USERNAME:
        required: false
      HOD_PASSWORD:
        required: false
      BASE_URL_STAGE:
        required: false
      BASE_URL_PROD:
        required: false
    outputs:
      merged-timings:
        description: "Combined timings JSON from split files"
        value: ${{ jobs.merge-split-timings.outputs.timings }}
jobs:
  validate-main-source:
    if: ${{ inputs.validate-main && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch ${{ inputs.main-source-branch }} branch
        run: git fetch origin ${{ inputs.main-source-branch }}:${{ inputs.main-source-branch }}

      - name: Verify commit exists in ${{ inputs.main-source-branch }}
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" ${{ inputs.main-source-branch }}; then
            echo "✅ Main commit exists in ${{ inputs.main-source-branch }} — OK"
          else
            echo "❌ Push to main must come from ${{ inputs.main-source-branch }}. Failing."
            exit 1
          fi

  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrixE2E: ${{ steps.prepareE2E.outputs.matrix }}
      matrixComponent: ${{ steps.prepareComponent.outputs.matrix }}
    steps:
      - name: Create E2E container matrix ⊹
        id: prepareE2E
        uses: bahmutov/gh-build-matrix@main
        with:
          n: ${{ inputs.nE2E }}
      - name: Create component container matrix ⊹
        id: prepareComponent
        uses: bahmutov/gh-build-matrix@main
        with:
          n: ${{ inputs.nComponent }}
      - name: Print result 🖨
        run: echo '${{ steps.prepareE2E.outputs.matrix }}'
      - name: Checkout 🛎
        uses: actions/checkout@v4
      - name: Install deps 📦
        uses: cypress-io/github-action@v6
        with:
          runTests: false
      - name: Before run 🧺
        if: ${{ inputs.before-run }}
        run: ${{ inputs.before-run }}

  e2eTests:
    if: ${{ inputs.nE2E > 0 }}
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrixE2E) }}
    steps:
      - name: Debug inputs 🐞
        if: ${{ inputs.debug-inputs }}
        env:
          WORKFLOW_INPUTS: ${{ toJson(inputs) }}
        run: echo "$WORKFLOW_INPUTS"

      - name: Checkout 🛎
        uses: actions/checkout@v4

      - name: Cypress tests 🧪
        id: cypress
        uses: cypress-io/github-action@v6
        continue-on-error: true
        env:
          SPLIT: ${{ strategy.job-total }}
          SPLIT_INDEX: ${{ strategy.job-index }}
          SPLIT_FILE: '${{ inputs.split-file }}'
          SPEC: '${{ inputs.spec }}'
          SKIP_SPEC: '${{ inputs.skip-spec }}'
          DEBUG: ${{ inputs.debug }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          EMPLOYEE_USERNAME: ${{ secrets.EMPLOYEE_USERNAME }}
          EMPLOYEE_PASSWORD: ${{ secrets.EMPLOYEE_PASSWORD }}
          SUPERVISOR_USERNAME: ${{ secrets.SUPERVISOR_USERNAME }}
          SUPERVISOR_PASSWORD: ${{ secrets.SUPERVISOR_PASSWORD }}
          HOD_USERNAME: ${{ secrets.HOD_USERNAME }}
          HOD_PASSWORD: ${{ secrets.HOD_PASSWORD }}
          BASE_URL_STAGE: ${{ secrets.BASE_URL_STAGE }}
          BASE_URL_PROD: ${{ secrets.BASE_URL_PROD }}
          CYPRESS_adminUsername: ${{ secrets.ADMIN_USERNAME }}
          CYPRESS_adminPassword: ${{ secrets.ADMIN_PASSWORD }}
          CYPRESS_employeeUsername: ${{ secrets.EMPLOYEE_USERNAME }}
          CYPRESS_employeePassword: ${{ secrets.EMPLOYEE_PASSWORD }}
          CYPRESS_supervisorUsername: ${{ secrets.SUPERVISOR_USERNAME }}
          CYPRESS_supervisorPassword: ${{ secrets.SUPERVISOR_PASSWORD }}
          CYPRESS_hodUsername: ${{ secrets.HOD_USERNAME }}
          CYPRESS_hodPassword: ${{ secrets.HOD_PASSWORD }}
        with:
          config: ${{ inputs.config }}
          config-file: ${{ inputs.config-file }}
          env: '${{ inputs.env }}'
          browser: ${{ inputs.browser }}
          build: ${{ inputs.build }}
          command: ${{ inputs.command }}
          start: ${{ inputs.start }}
          start-windows: ${{ inputs.start-windows }}
          install: ${{ inputs.install }}
          install-command: ${{ inputs.install-command }}
          runTests: ${{ inputs.runTests }}
          wait-on: ${{ inputs.wait-on }}
          wait-on-timeout: ${{ inputs.wait-on-timeout }}
          working-directory: ${{ inputs.working-directory }}
          headed: ${{ inputs.headed }}
          spec: ${{ inputs.spec }}
          project: ${{ inputs.project }}
          command-prefix: ${{ inputs.command-prefix }}
          cache-key: ${{ inputs.cache-key }}
          quiet: ${{ inputs.quiet }}
          publish-summary: ${{ inputs.publish-summary }}

      - name: Upload artifacts 📦
        uses: actions/upload-artifact@v4
        if: ${{ inputs.store-artifacts && always() }}
        with:
          name: cypress-split-results-e2e-${{ strategy.job-index }}
          path: |
            cypress/screenshots
            cypress/videos
            cypress/results
            coverage
            ${{ inputs.split-file }}
          if-no-files-found: ignore

      - name: Fail pipeline if tests failed ❌
        if: ${{ steps.cypress.outcome == 'failure' }}
        run: exit 1

  componentTests:
    if: ${{ inputs.nComponent > 0 }}
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrixComponent) }}
    steps:
      - name: Debug inputs 🐞
        if: ${{ inputs.debug-inputs }}
        env:
          WORKFLOW_INPUTS: ${{ toJson(inputs) }}
        run: echo "$WORKFLOW_INPUTS"
      - name: Checkout 🛎
        uses: actions/checkout@v4
      - name: Cypress tests 🧪
        id: cypress
        uses: cypress-io/github-action@v6
        continue-on-error: true
        env:
          SPLIT: ${{ strategy.job-total }}
          SPLIT_INDEX: ${{ strategy.job-index }}
          SPEC: '${{ inputs.spec }}'
          SKIP_SPEC: '${{ inputs.skip-spec }}'
          DEBUG: ${{ inputs.debug }}
        with:
          config: ${{ inputs.config }}
          config-file: ${{ inputs.config-file }}
          env: '${{ inputs.env }}'
          browser: ${{ inputs.browser }}
          build: ${{ inputs.build }}
          command: ${{ inputs.command }}
          install: ${{ inputs.install }}
          install-command: ${{ inputs.install-command }}
          runTests: ${{ inputs.runTests }}
          working-directory: ${{ inputs.working-directory }}
          headed: ${{ inputs.headed }}
          spec: ${{ inputs.spec }}
          project: ${{ inputs.project }}
          command-prefix: ${{ inputs.command-prefix }}
          cache-key: ${{ inputs.cache-key }}
          quiet: ${{ inputs.quiet }}
          component: true
      - name: Upload artifacts 📦
        uses: actions/upload-artifact@v4
        if: ${{ inputs.store-artifacts && always() }}
        with:
          name: cypress-split-results-component-${{ strategy.job-index }}
          path: |
            cypress/screenshots
            cypress/videos
            cypress/results
            coverage
          if-no-files-found: ignore
      - name: Fail pipeline if tests failed ❌
        if: ${{ steps.cypress.outcome == 'failure' }}
        run: exit 1

  merge-reports:
    if: ${{ always() && inputs.store-artifacts && inputs.marge }}
    needs: [e2eTests, componentTests]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4
      - name: Install dependencies 🧪
        uses: cypress-io/github-action@v6
        with:
          runTests: false
      - uses: actions/download-artifact@v4
        with:
          path: split-results
      - name: Display structure of downloaded files
        run: ls -R split-results
      - name: Prepare folder
        run: |
          mkdir mochawesome
          mkdir -p mochawesome/screenshots
          mkdir -p mochawesome/videos
          mkdir -p mochawesome/results
      - name: Copy all assets and JSON reports
        run: |
          cp -r split-results/cypress-split-results-*/cypress/screenshots/* mochawesome/screenshots || true
          cp -r split-results/cypress-split-results-*/cypress/videos/* mochawesome/videos || true
          cp -r split-results/cypress-split-results-*/cypress/results/* mochawesome/results || true
      - name: Show copied files
        run: ls -lR mochawesome
      - name: Merge Mochawesome JSON reports
        run: npx mochawesome-merge mochawesome/results/*.json -o mochawesome/results/merged.json
      - name: Generate Mochawesome HTML report
        run: |
          npx marge mochawesome/results/merged.json \
            --charts true --showHooks always \
            --reportDir mochawesome/results \
            --reportFilename index.html
      - uses: actions/upload-artifact@v4
        with:
          name: merged-mochawesome-report
          path: mochawesome

  merge-coverage:
    if: ${{ always() && inputs.store-artifacts && inputs.coverage }}
    needs: [e2eTests, componentTests]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4
      - name: Install dependencies 🧪
        uses: cypress-io/github-action@v6
        with:
          runTests: false
      - uses: actions/download-artifact@v4
        with:
          path: split-results
      - name: Display structure of downloaded files
        run: ls -R split-results
      - name: Merge coverage reports
        run: npx cc-merge split-results
      - uses: actions/upload-artifact@v4
        with:
          name: merged-coverage
          path: coverage

  merge-split-timings:
    if: ${{ always() && inputs.split-file }}
    needs: [e2eTests]
    outputs:
      timings: ${{ steps.merge.outputs.merged-timings }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4
      - name: Install dependencies 🧪
        uses: cypress-io/github-action@v6
        with:
          runTests: false
      - uses: actions/download-artifact@v4
        with:
          path: split-results
      - name: Display structure of downloaded files
        run: ls -R split-results
      - name: Merge split timings
        id: merge
        run: |
          npx cypress-split-merge \
            --parent-folder split-results \
            --split-file ${{ inputs.split-file }} \
            --output ${{ inputs.split-file }} \
            --set-gha-output merged-timings
        env:
          DEBUG: ${{ inputs.debug }}
      - name: Print timings 🖨️
        run: |
          echo off
          echo Merged timings
          echo '${{ steps.merge.outputs.merged-timings }}'
      - uses: actions/upload-artifact@v4
        with:
          name: merged-split-file
          path: '${{ inputs.split-file }}'
